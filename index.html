<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/travelplan/travel.png" />
    <link rel="apple-touch-icon" href="/travelplan/travel.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Travel Plan" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Travel Plan</title>
    <!-- 預載關鍵資源 -->
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" />
    <link rel="preconnect" href="https://firestore.googleapis.com" />
    <style>
      /* 即時載入骨架畫面 - 不需要等 JS 就能顯示 */
      .app-shell {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .app-shell-icon {
        width: 64px;
        height: 64px;
        margin-bottom: 16px;
        animation: app-shell-pulse 1.5s ease-in-out infinite;
      }
      .app-shell-title {
        font-size: 20px;
        font-weight: 700;
        background: linear-gradient(135deg, #2563eb, #60a5fa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 24px;
      }
      .app-shell-spinner {
        width: 28px;
        height: 28px;
        border: 3px solid #e2e8f0;
        border-top-color: #2563eb;
        border-radius: 50%;
        animation: app-shell-spin 0.7s linear infinite;
      }
      @keyframes app-shell-spin {
        to { transform: rotate(360deg); }
      }
      @keyframes app-shell-pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(0.95); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- 即時骨架畫面：React 掛載前就能看到 -->
      <div class="app-shell">
        <img src="/travelplan/travel.png" alt="" class="app-shell-icon" />
        <div class="app-shell-title">Travel Plan</div>
        <div class="app-shell-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
