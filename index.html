<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/travelplan/travel.png" />
    <link rel="apple-touch-icon" href="/travelplan/travel.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Travel Plan" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Travel Plan</title>
    <!-- 預載關鍵資源 -->
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" />
    <link rel="preconnect" href="https://firestore.googleapis.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      /* 即時載入骨架畫面 - 不需要等 JS 就能顯示 */
      .app-shell {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #fafafa;
        color: #18181b;
        font-family: 'Inter', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        transition: background-color 0.2s;
      }
      @media (prefers-color-scheme: dark) {
        .app-shell {
          background: #09090b;
          color: #fafafa;
        }
      }
      .app-shell-icon {
        width: 56px;
        height: 56px;
        margin-bottom: 14px;
        border-radius: 14px;
      }
      .app-shell-title {
        font-size: 18px;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin-bottom: 20px;
      }
      .app-shell-spinner {
        width: 24px;
        height: 24px;
        border: 2.5px solid #e4e4e7;
        border-top-color: #2563eb;
        border-radius: 50%;
        animation: app-shell-spin 0.7s linear infinite;
      }
      @media (prefers-color-scheme: dark) {
        .app-shell-spinner {
          border-color: #27272a;
          border-top-color: #3b82f6;
        }
      }
      @keyframes app-shell-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- 即時骨架畫面：React 掛載前就能看到 -->
      <div class="app-shell">
        <img src="/travelplan/travel.png" alt="" class="app-shell-icon" />
        <div class="app-shell-title">Travel Plan</div>
        <div class="app-shell-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
